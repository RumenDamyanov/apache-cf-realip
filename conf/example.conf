# apache-cf-remoteip Example Configuration
#
# Version: 0.1.0
#
# This module fetches Cloudflare's IPv4/IPv6 CIDR ranges and generates
# RemoteIPTrustedProxy directives for Apache's mod_remoteip.
#

LoadModule cf_remoteip_module modules/mod_cf_remoteip.so
LoadModule remoteip_module modules/mod_remoteip.so

# Enable Cloudflare IP fetching
CfRemoteipEnabled on

# Refresh interval in seconds (default: 3600, minimum: 300)
CfRemoteipRefreshInterval 3600

# Where to write the generated RemoteIPTrustedProxy config
CfRemoteipOutputPath /etc/apache2/conf-available/cf-trusted-proxies.conf

# Include the generated trusted proxy list
Include /etc/apache2/conf-available/cf-trusted-proxies.conf

# Use the Cloudflare header for real client IP
RemoteIPHeader CF-Connecting-IP
